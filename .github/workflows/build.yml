name: Зібрати APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PlaylistBot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistBot-APK
          path: PlaylistBot.apk
      - name: Опублікувати реліз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Плейлист-Бот (остання версія)
          body: Завантажте PlaylistBot.apk нижче і встановіть на телефон.
          files: PlaylistBot.apk
          make_latest: true
