plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.bogven.playlistbot'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.bogven.playlistbot'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        fixed {
            storeFile file('playlistbot.keystore')
            storePassword 'playlistbot'
            keyAlias 'playlistbot'
            keyPassword 'playlistbot'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
